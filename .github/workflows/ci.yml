name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Criar .env de placeholder (necessário só pra satisfazer o asset do pubspec)
        run: cp .env.example .env

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test
